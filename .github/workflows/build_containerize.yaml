name: Build and Push Go-Countries to GHCR

on:
  push:
    tags: 
     - "*"


jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # 1. Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # 3. Build the Go binary
      - name: Build Go binary
        run: |
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o go-countries .

      # 4. Create Dockerfile
      - name: Create Dockerfile
        run: |
          cat > Dockerfile <<'EOF'
          FROM alpine:3.14
          WORKDIR /app
          COPY go-countries .
          RUN chmod +x ./go-countries
          CMD ["/app/go-countries"]
          EOF

      # 5. Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Prepare image tags
      - name: Set Docker image tags
        id: vars
        run: |
          REPO_OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME=ghcr.io/$REPO_OWNER/go-countries
          VERSION_TAG="${{ github.ref_name }}"

          {
          echo "tags<<EOF"
          echo "${IMAGE_NAME}:latest"
          echo "${IMAGE_NAME}:${VERSION_TAG}"
          echo "EOF"
          } >> "$GITHUB_OUTPUT"


      # 7. Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          file: ./Dockerfile

