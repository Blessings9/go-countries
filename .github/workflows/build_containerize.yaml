name: Build and Push Go-Countries to GHCR (on tag)

on:
  push:
    tags:
      - "*"   # trigger only when a Git tag is pushed (e.g., v1.0.0)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # 🧩 1. Checkout your source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 🧰 2. Set up Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # ⚙️ 3. Build the Go binary
      - name: Build binary
        run: |
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o go-countries .

      # 🧳 4. Log in to GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🏷️ 5. Prepare image tags based on the Git tag
      - name: Set image tags
        id: vars
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/go-countries
          VERSION_TAG=${GITHUB_REF#refs/tags/}
          TAGS="${IMAGE_NAME}:latest,${IMAGE_NAME}:${VERSION_TAG}"
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      # 🧱 6. Build and push the image (no Dockerfile needed)
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          file: <(echo '
            FROM alpine:3.14
            WORKDIR /app
            COPY go-countries .
            RUN chmod +x ./go-countries
            CMD ["/app/go-countries"]
          ')

