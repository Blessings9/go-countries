name: Build and Push Go-Countries to GHCR (on tag)

on:
  push:
    tags:
      - "*"   # trigger only when a Git tag is pushed (e.g., v1.0.0)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build binary
        run: |
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o go-countries .

      - name: Create Dockerfile
        run: |
          cat > Dockerfile <<'EOF'
          FROM alpine:3.14
          WORKDIR /app
          COPY go-countries .
          RUN chmod +x ./go-countries
          CMD ["/app/go-countries"]
          EOF

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: vars
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/go-countries
          VERSION_TAG=${GITHUB_REF#refs/tags/}
          # produce a newline-separated list of tags (accepted by docker/build-push-action)
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          printf "%s\n" "${IMAGE_NAME}:latest" "${IMAGE_NAME}:${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          file: ./Dockerfile

